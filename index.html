<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Uygulaması</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .input-row button {
      padding: 10px 16px;
      background: #fff;
      color: #4f46e5;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .input-row button:hover {
      background: #e0e7ff;
    }

    .filters {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .filters button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .filters button.active {
      color: #4f46e5;
      border-bottom-color: #4f46e5;
      font-weight: 600;
    }

    .todo-list {
      list-style: none;
      min-height: 200px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.1s;
    }

    .todo-item:hover {
      background: #fafafa;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item span {
      flex: 1;
      font-size: 15px;
      color: #1f2937;
      word-break: break-word;
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover {
      color: #ef4444;
    }

    .empty {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 48px 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .error-bar {
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      padding: 10px 20px;
      display: none;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #f9fafb;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
    }

    .footer button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 13px;
      cursor: pointer;
    }

    .footer button:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Yapılacaklar</h1>
      <div class="input-row">
        <input type="text" id="todoInput" placeholder="Yeni görev ekle..." maxlength="120">
        <button onclick="addTodo()">+</button>
      </div>
    </div>

    <div class="filters">
      <button class="active" onclick="setFilter('all', this)">Tümü</button>
      <button onclick="setFilter('active', this)">Bekleyen</button>
      <button onclick="setFilter('done', this)">Tamamlanan</button>
    </div>

    <div id="errorBar" class="error-bar"></div>
    <ul class="todo-list" id="todoList"><li class="loading">Yükleniyor...</li></ul>

    <div class="footer">
      <span id="countLabel"></span>
      <button onclick="clearDone()">Tamamlananları Sil</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bbkquayotgfjhkfidmhw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJia3F1YXlvdGdmamhrZmlkbWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTA0MzMsImV4cCI6MjA5MzY2NjQzM30.VpLhHu6vOubagxFKFlcid0drAkOjKkTZv4v_ZmWkIyU';
    const BASE = `${SUPABASE_URL}/rest/v1/todos`;

    const headers = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Prefer': 'return=representation'
    };

    let todos = [];
    let filter = 'all';

    function showError(msg) {
      const bar = document.getElementById('errorBar');
      bar.textContent = msg;
      bar.style.display = 'block';
      setTimeout(() => bar.style.display = 'none', 4000);
    }

    async function apiFetch(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : [];
    }

    async function loadTodos() {
      try {
        todos = await apiFetch(`${BASE}?order=created_at.desc`);
        render();
      } catch (e) {
        showError('Görevler yüklenemedi: ' + e.message);
        document.getElementById('todoList').innerHTML = '<li class="empty">Yüklenemedi.</li>';
      }
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      try {
        const [created] = await apiFetch(BASE, {
          method: 'POST',
          body: JSON.stringify({ text, done: false })
        });
        todos.unshift(created);
        render();
      } catch (e) {
        showError('Görev eklenemedi: ' + e.message);
        input.value = text;
      }
    }

    async function toggle(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;
      const newDone = !todo.done;
      todos = todos.map(t => t.id === id ? { ...t, done: newDone } : t);
      render();
      try {
        await apiFetch(`${BASE}?id=eq.${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ done: newDone })
        });
      } catch (e) {
        todos = todos.map(t => t.id === id ? { ...t, done: todo.done } : t);
        render();
        showError('Güncelleme başarısız: ' + e.message);
      }
    }

    async function remove(id) {
      const prev = [...todos];
      todos = todos.filter(t => t.id !== id);
      render();
      try {
        await apiFetch(`${BASE}?id=eq.${id}`, { method: 'DELETE', headers: { 'Prefer': '' } });
      } catch (e) {
        todos = prev;
        render();
        showError('Silme başarısız: ' + e.message);
      }
    }

    async function clearDone() {
      const doneIds = todos.filter(t => t.done).map(t => t.id);
      if (!doneIds.length) return;
      const prev = [...todos];
      todos = todos.filter(t => !t.done);
      render();
      try {
        await apiFetch(`${BASE}?done=eq.true`, { method: 'DELETE', headers: { 'Prefer': '' } });
      } catch (e) {
        todos = prev;
        render();
        showError('Toplu silme başarısız: ' + e.message);
      }
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
      const list = document.getElementById('todoList');
      const filtered = todos.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty">Görev bulunamadı.</li>';
      } else {
        list.innerHTML = filtered.map(t => `
          <li class="todo-item ${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
            <span>${escHtml(t.text)}</span>
            <button class="delete-btn" onclick="remove(${t.id})">✕</button>
          </li>
        `).join('');
      }

      const remaining = todos.filter(t => !t.done).length;
      document.getElementById('countLabel').textContent = `${remaining} görev bekliyor`;
    }

    document.getElementById('todoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    loadTodos();
  </script>
</body>
</html>
