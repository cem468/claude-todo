<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Uygulaması</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    /* ── Auth card ── */
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .auth-header {
      background: #4f46e5;
      color: #fff;
      padding: 28px 28px 20px;
    }

    .auth-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .auth-header p  { font-size: 13px; opacity: .8; }

    .auth-body { padding: 28px; display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: #374151; font-weight: 500; }
    .field input {
      padding: 10px 13px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: #4f46e5; }

    /* OTP boxes */
    .otp-row { display: flex; gap: 10px; justify-content: center; margin: 4px 0; }
    .otp-box {
      width: 46px; height: 54px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
      color: #4f46e5;
      transition: border-color .15s;
    }
    .otp-box:focus { border-color: #4f46e5; }

    .btn {
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      margin-top: 4px;
    }
    .btn:hover   { background: #4338ca; }
    .btn:disabled{ opacity: .55; cursor: not-allowed; }
    .btn.secondary {
      background: none;
      color: #4f46e5;
      border: 1.5px solid #4f46e5;
    }
    .btn.secondary:hover { background: #eef2ff; }

    .switch-row {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }
    .switch-row a { color: #4f46e5; cursor: pointer; text-decoration: none; font-weight: 500; }
    .switch-row a:hover { text-decoration: underline; }

    .alert {
      font-size: 13px;
      padding: 10px 13px;
      border-radius: 8px;
      display: none;
    }
    .alert.error   { background: #fef2f2; color: #b91c1c; }
    .alert.success { background: #f0fdf4; color: #166534; }
    .alert.info    { background: #eff6ff; color: #1d4ed8; }

    /* ── Todo app ── */
    .app-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      display: none;
    }

    .app-header {
      background: #4f46e5;
      color: #fff;
      padding: 20px 24px;
    }

    .app-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .app-header h1 { font-size: 20px; font-weight: 700; }
    .user-email { font-size: 11px; opacity: .75; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .logout-btn {
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .logout-btn:hover { background: rgba(255,255,255,.3); }

    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-row button {
      padding: 10px 16px;
      background: #fff;
      color: #4f46e5;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .input-row button:hover { background: #e0e7ff; }

    .filters { display: flex; border-bottom: 1px solid #e5e7eb; }
    .filters button {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all .15s;
    }
    .filters button.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }

    .error-bar {
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      padding: 10px 20px;
      display: none;
    }

    .todo-list { list-style: none; min-height: 180px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background .1s;
    }
    .todo-item:hover { background: #fafafa; }
    .todo-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item span {
      flex: 1;
      font-size: 15px;
      color: #1f2937;
      word-break: break-word;
    }
    .todo-item.done span { text-decoration: line-through; color: #9ca3af; }
    .todo-item .del {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 17px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color .15s;
      flex-shrink: 0;
    }
    .todo-item .del:hover { color: #ef4444; }

    .empty, .loading {
      text-align: center;
      padding: 44px 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .app-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #f9fafb;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid #e5e7eb;
    }
    .app-footer button {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 13px;
      cursor: pointer;
    }
    .app-footer button:hover { text-decoration: underline; }

    /* hidden util */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── AUTH CARD ── -->
  <div class="auth-card" id="authCard">

    <!-- Register -->
    <div id="viewRegister">
      <div class="auth-header">
        <h1>Kayıt Ol</h1>
        <p>Hesap oluşturup görevlerini yönet</p>
      </div>
      <div class="auth-body">
        <div id="regAlert" class="alert"></div>
        <div class="field">
          <label>E-posta</label>
          <input type="email" id="regEmail" placeholder="ornek@mail.com">
        </div>
        <div class="field">
          <label>Şifre</label>
          <input type="password" id="regPass" placeholder="En az 6 karakter">
        </div>
        <button class="btn" id="regBtn" onclick="register()">Kayıt Ol</button>
        <div class="switch-row">Zaten hesabın var mı? <a onclick="show('viewLogin')">Giriş yap</a></div>
      </div>
    </div>

    <!-- OTP Verify -->
    <div id="viewOtp" class="hidden">
      <div class="auth-header">
        <h1>E-posta Doğrulama</h1>
        <p id="otpHint">Mailinize gönderilen 6 haneli kodu girin</p>
      </div>
      <div class="auth-body">
        <div id="otpAlert" class="alert"></div>
        <div class="otp-row" id="otpRow"></div>
        <button class="btn" id="otpBtn" onclick="verifyOtp()">Doğrula</button>
        <button class="btn secondary" onclick="resendOtp()">Kodu Tekrar Gönder</button>
        <div class="switch-row"><a onclick="show('viewLogin')">Geri dön</a></div>
      </div>
    </div>

    <!-- Login -->
    <div id="viewLogin" class="hidden">
      <div class="auth-header">
        <h1>Giriş Yap</h1>
        <p>Hesabına giriş yap</p>
      </div>
      <div class="auth-body">
        <div id="loginAlert" class="alert"></div>
        <div class="field">
          <label>E-posta</label>
          <input type="email" id="loginEmail" placeholder="ornek@mail.com">
        </div>
        <div class="field">
          <label>Şifre</label>
          <input type="password" id="loginPass" placeholder="Şifreniz">
        </div>
        <button class="btn" id="loginBtn" onclick="login()">Giriş Yap</button>
        <div class="switch-row">Hesabın yok mu? <a onclick="show('viewRegister')">Kayıt ol</a></div>
      </div>
    </div>

  </div>

  <!-- ── TODO APP ── -->
  <div class="app-card" id="appCard">
    <div class="app-header">
      <div class="app-header-top">
        <div>
          <h1>Yapılacaklar</h1>
          <div class="user-email" id="userEmail"></div>
        </div>
        <button class="logout-btn" onclick="logout()">Çıkış</button>
      </div>
      <div class="input-row">
        <input type="text" id="todoInput" placeholder="Yeni görev ekle..." maxlength="120">
        <button onclick="addTodo()">+</button>
      </div>
    </div>
    <div class="filters">
      <button class="active" onclick="setFilter('all',this)">Tümü</button>
      <button onclick="setFilter('active',this)">Bekleyen</button>
      <button onclick="setFilter('done',this)">Tamamlanan</button>
    </div>
    <div id="appError" class="error-bar"></div>
    <ul class="todo-list" id="todoList"><li class="loading">Yükleniyor…</li></ul>
    <div class="app-footer">
      <span id="countLabel"></span>
      <button onclick="clearDone()">Tamamlananları Sil</button>
    </div>
  </div>

<script>
  /* ─── Config ─── */
  const SB_URL  = 'https://bbkquayotgfjhkfidmhw.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJia3F1YXlvdGdmamhrZmlkbWh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTA0MzMsImV4cCI6MjA5MzY2NjQzM30.VpLhHu6vOubagxFKFlcid0drAkOjKkTZv4v_ZmWkIyU';
  const AUTH    = `${SB_URL}/auth/v1`;
  const REST    = `${SB_URL}/rest/v1/todos`;

  /* ─── State ─── */
  let session      = JSON.parse(localStorage.getItem('sb_session') || 'null');
  let pendingEmail = '';
  let todos        = [];
  let filter       = 'all';

  /* ─── Auth helpers ─── */
  function authHeaders(extra = {}) {
    return {
      'Content-Type': 'application/json',
      'apikey': SB_ANON,
      'Authorization': `Bearer ${session ? session.access_token : SB_ANON}`,
      ...extra
    };
  }

  async function sbFetch(url, opts = {}) {
    const res = await fetch(url, {
      ...opts,
      headers: { ...authHeaders(), ...(opts.headers || {}) }
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : {};
    if (!res.ok) throw new Error(data.error_description || data.message || data.msg || `HTTP ${res.status}`);
    return data;
  }

  /* ─── View helpers ─── */
  function show(viewId) {
    ['viewRegister','viewOtp','viewLogin'].forEach(id =>
      document.getElementById(id).classList.toggle('hidden', id !== viewId)
    );
  }

  function alert_(elId, msg, type = 'error') {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.className = `alert ${type}`;
    el.style.display = msg ? 'block' : 'none';
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? 'Lütfen bekleyin…' : btn.dataset.label;
  }

  /* ─── OTP input boxes ─── */
  function buildOtpBoxes() {
    const row = document.getElementById('otpRow');
    row.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.maxLength = 1;
      inp.className = 'otp-box';
      inp.dataset.idx = i;
      inp.addEventListener('input', e => {
        const v = e.target.value.replace(/\D/g,'');
        e.target.value = v;
        if (v && i < 5) row.children[i+1].focus();
        if (otpValue().length === 6) verifyOtp();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0)
          row.children[i-1].focus();
        if (e.key === 'Enter') verifyOtp();
      });
      inp.addEventListener('paste', e => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
        [...paste].forEach((ch, j) => { if (row.children[j]) row.children[j].value = ch; });
        if (paste.length === 6) { row.children[5].focus(); verifyOtp(); }
      });
      row.appendChild(inp);
    }
  }

  function otpValue() {
    return [...document.querySelectorAll('.otp-box')].map(b => b.value).join('');
  }

  function clearOtpBoxes() {
    document.querySelectorAll('.otp-box').forEach(b => b.value = '');
    document.querySelector('.otp-box')?.focus();
  }

  /* ─── Auth actions ─── */
  async function register() {
    const email = document.getElementById('regEmail').value.trim();
    const pass  = document.getElementById('regPass').value;
    alert_('regAlert', '');
    if (!email || !pass) return alert_('regAlert', 'E-posta ve şifre gerekli.');
    if (pass.length < 6)  return alert_('regAlert', 'Şifre en az 6 karakter olmalı.');
    document.getElementById('regBtn').disabled = true;
    document.getElementById('regBtn').textContent = 'Kaydediliyor…';
    try {
      await sbFetch(`${AUTH}/signup`, {
        method: 'POST',
        body: JSON.stringify({ email, password: pass })
      });
      pendingEmail = email;
      buildOtpBoxes();
      document.getElementById('otpHint').textContent = `${email} adresine gönderilen 6 haneli kodu girin`;
      alert_('otpAlert', '');
      show('viewOtp');
      setTimeout(() => document.querySelector('.otp-box')?.focus(), 50);
    } catch(e) {
      alert_('regAlert', e.message);
    } finally {
      document.getElementById('regBtn').disabled = false;
      document.getElementById('regBtn').textContent = 'Kayıt Ol';
    }
  }

  async function verifyOtp() {
    const token = otpValue();
    alert_('otpAlert', '');
    if (token.length !== 6) return alert_('otpAlert', 'Lütfen 6 haneli kodu eksiksiz girin.');
    document.getElementById('otpBtn').disabled = true;
    document.getElementById('otpBtn').textContent = 'Doğrulanıyor…';
    try {
      const data = await sbFetch(`${AUTH}/verify`, {
        method: 'POST',
        body: JSON.stringify({ type: 'signup', email: pendingEmail, token })
      });
      saveSession(data);
      startApp();
    } catch(e) {
      alert_('otpAlert', 'Kod hatalı veya süresi dolmuş. Lütfen tekrar deneyin.');
      clearOtpBoxes();
    } finally {
      document.getElementById('otpBtn').disabled = false;
      document.getElementById('otpBtn').textContent = 'Doğrula';
    }
  }

  async function resendOtp() {
    alert_('otpAlert', '');
    if (!pendingEmail) return;
    try {
      await sbFetch(`${AUTH}/resend`, {
        method: 'POST',
        body: JSON.stringify({ type: 'signup', email: pendingEmail })
      });
      alert_('otpAlert', 'Kod tekrar gönderildi.', 'success');
      clearOtpBoxes();
    } catch(e) {
      alert_('otpAlert', e.message);
    }
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    alert_('loginAlert', '');
    if (!email || !pass) return alert_('loginAlert', 'E-posta ve şifre gerekli.');
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = 'Giriş yapılıyor…';
    try {
      const data = await sbFetch(`${AUTH}/token?grant_type=password`, {
        method: 'POST',
        body: JSON.stringify({ email, password: pass })
      });
      saveSession(data);
      startApp();
    } catch(e) {
      const msg = e.message.toLowerCase().includes('invalid') ? 'E-posta veya şifre hatalı.' : e.message;
      alert_('loginAlert', msg);
    } finally {
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'Giriş Yap';
    }
  }

  async function logout() {
    try {
      await sbFetch(`${AUTH}/logout`, { method: 'POST' });
    } catch(_) {}
    clearSession();
    showAuth();
  }

  function saveSession(data) {
    session = data;
    localStorage.setItem('sb_session', JSON.stringify(data));
  }

  function clearSession() {
    session = null;
    localStorage.removeItem('sb_session');
  }

  /* ─── App startup ─── */
  function startApp() {
    document.getElementById('authCard').style.display = 'none';
    document.getElementById('appCard').style.display  = 'block';
    document.getElementById('userEmail').textContent  = session.user?.email || '';
    loadTodos();
    document.getElementById('todoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });
  }

  function showAuth() {
    document.getElementById('authCard').style.display = 'block';
    document.getElementById('appCard').style.display  = 'none';
    show('viewLogin');
  }

  /* ─── Todo REST helpers ─── */
  function todoHeaders(extra = {}) {
    return {
      'Content-Type': 'application/json',
      'apikey': SB_ANON,
      'Authorization': `Bearer ${session.access_token}`,
      'Prefer': 'return=representation',
      ...extra
    };
  }

  async function todoFetch(url, opts = {}) {
    const res = await fetch(url, {
      ...opts,
      headers: { ...todoHeaders(), ...(opts.headers || {}) }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  }

  function showAppError(msg) {
    const bar = document.getElementById('appError');
    bar.textContent = msg;
    bar.style.display = 'block';
    setTimeout(() => bar.style.display = 'none', 4000);
  }

  /* ─── Todo CRUD ─── */
  async function loadTodos() {
    try {
      todos = await todoFetch(`${REST}?order=created_at.desc`);
      render();
    } catch(e) {
      showAppError('Görevler yüklenemedi: ' + e.message);
      document.getElementById('todoList').innerHTML = '<li class="empty">Yüklenemedi.</li>';
    }
  }

  async function addTodo() {
    const input = document.getElementById('todoInput');
    const text  = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      const [created] = await todoFetch(REST, {
        method: 'POST',
        body: JSON.stringify({ text, done: false, user_id: session.user.id })
      });
      todos.unshift(created);
      render();
    } catch(e) {
      showAppError('Görev eklenemedi: ' + e.message);
      input.value = text;
    }
  }

  async function toggle(id) {
    const todo   = todos.find(t => t.id === id);
    if (!todo) return;
    const newDone = !todo.done;
    todos = todos.map(t => t.id === id ? { ...t, done: newDone } : t);
    render();
    try {
      await todoFetch(`${REST}?id=eq.${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ done: newDone })
      });
    } catch(e) {
      todos = todos.map(t => t.id === id ? { ...t, done: todo.done } : t);
      render();
      showAppError('Güncelleme başarısız: ' + e.message);
    }
  }

  async function remove(id) {
    const prev = [...todos];
    todos = todos.filter(t => t.id !== id);
    render();
    try {
      await todoFetch(`${REST}?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'Prefer': '' }
      });
    } catch(e) {
      todos = prev;
      render();
      showAppError('Silme başarısız: ' + e.message);
    }
  }

  async function clearDone() {
    if (!todos.some(t => t.done)) return;
    const prev = [...todos];
    todos = todos.filter(t => !t.done);
    render();
    try {
      await todoFetch(`${REST}?done=eq.true`, {
        method: 'DELETE',
        headers: { 'Prefer': '' }
      });
    } catch(e) {
      todos = prev;
      render();
      showAppError('Toplu silme başarısız: ' + e.message);
    }
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const list     = document.getElementById('todoList');
    const filtered = todos.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );
    list.innerHTML = filtered.length === 0
      ? '<li class="empty">Görev bulunamadı.</li>'
      : filtered.map(t => `
          <li class="todo-item ${t.done ? 'done' : ''}">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
            <span>${escHtml(t.text)}</span>
            <button class="del" onclick="remove(${t.id})">✕</button>
          </li>`).join('');
    const remaining = todos.filter(t => !t.done).length;
    document.getElementById('countLabel').textContent = `${remaining} görev bekliyor`;
  }

  /* ─── Init ─── */
  if (session?.access_token) {
    startApp();
  } else {
    showAuth();
  }
</script>
</body>
</html>
